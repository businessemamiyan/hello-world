plugins {
    id "com.android.application"
}

android {
    namespace "ir.mehrdad.app"
    compileSdk 34

    defaultConfig {
        applicationId "ir.mehrdad.app"
        minSdk 26
        targetSdk 34
        // هر انتشار باید versionCode بزرگ‌تری داشته باشد، وگرنه اندروید به‌روزرسانی را رد می‌کند
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        // کلید امضای ثابت (فقط روی سرور ساخت، با متغیرهای محیطی). بدون آن، دیباگ ساخته می‌شود.
        release {
            def ks = System.getenv("MEHRDAD_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("MEHRDAD_KS_PASS")
                keyAlias "mehrdad"
                keyPassword System.getenv("MEHRDAD_KS_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("MEHRDAD_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.work:work-runtime:2.9.1"
}
