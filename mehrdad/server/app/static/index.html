<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F18">
<meta name="mobile-web-app-capable" content="yes">
<title>MEHRAD</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="m-logo">م</span>
      <div><b>MEHRAD</b><small id="subtitle">مغز دوم تو</small></div>
    </div>
    <div class="row" style="flex-wrap:nowrap;gap:4px">
      <button class="x m-hb" id="refBtn" title="تازه‌سازی" aria-label="تازه‌سازی">⟳</button>
      <button class="x m-hb" id="privBtn" title="بخش‌های خصوصی" aria-label="بخش‌های خصوصی">🔒</button>
      <button class="x m-hb" id="setBtn" title="تنظیمات" aria-label="تنظیمات">⚙</button>
    </div>
  </header>
  <div id="ptr" class="ptr" hidden aria-hidden="true">⟳</div>
  <main id="view"></main>
</div>

<nav class="bottom" id="nav" hidden>
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>امروز</button>
  <button data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14.5" r="1.2"/></svg>حساب‌ها</button>
  <button data-tab="life"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>زندگی</button>
  <button data-tab="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/></svg>مربی</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>هدف‌ها</button>
  <button data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>مهراد</button>
</nav>

<input type="file" id="photoIn" accept="image/*" hidden>
<div id="modal" hidden></div>
<div id="toast" class="m-toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
