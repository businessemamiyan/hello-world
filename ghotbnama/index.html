<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قطب‌نمای درآمد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
/* طراحی عمداً تک‌تم (دارک) است */
:root{
  color-scheme:dark;
  --bg:#0A0F18; --surface:#111A28; --surface2:#16223A; --sunk:#0C1421; --line:#22324A; --line2:#2C3F5C;
  --ink:#E8EDF5; --ink2:#A7B3C5; --ink3:#71809A;
  --gold:#E3B35C; --gold-ink:#1A1405; --gold-soft:#2C2515;
  --ai:#7DB0FF; --ai-soft:#12213A; --ai-line:#284A7A;
  --good:#4CC08E; --warn:#E6A246; --crit:#EE7466; --info:#8FA6C4;
  --good-bg:#11302A; --warn-bg:#33270F; --crit-bg:#3A1A18; --info-bg:#172338;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 Vazirmatn,Tahoma,"Segoe UI",sans-serif;direction:rtl;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.4}
h2{font-size:1.08rem;font-weight:900}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--ai)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand b{font-weight:900;font-size:.98rem;white-space:nowrap}
.brand small{display:block;color:var(--ink3);font-size:.75rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-mode{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:transparent;white-space:nowrap}
.chip-mode.demo{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}

nav.bottom{position:fixed;inset-inline:0;bottom:0;z-index:8;background:rgba(10,15,24,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;backdrop-filter:blur(8px)}
nav.bottom button{border:0;background:transparent;color:var(--ink3);display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:.72rem;font-weight:700}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--gold);background:var(--gold-soft)}

section.pane{display:grid;gap:14px;padding-top:14px}
.pane-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pane-title h1{font-size:1.25rem;font-weight:900}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.card.ai{background:var(--ai-soft);border-color:var(--ai-line)}
.card.gold{background:var(--gold-soft);border-color:#5A4A24}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--ink3);font-size:.84rem}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;color:var(--ink3);letter-spacing:.4px;font-weight:700}
.stack{display:grid;gap:10px}
.stack6{display:grid;gap:6px}

.btn{border:1px solid var(--line2);background:var(--surface2);padding:8px 14px;border-radius:10px;font-weight:700;font-size:.88rem;min-height:40px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.ai{background:var(--ai-line);border-color:var(--ai);color:#EAF2FF}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.danger{color:var(--crit);border-color:#5A2A26}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:default}
.x{border:0;background:transparent;color:var(--ink3);font-size:1.05rem;line-height:1;padding:6px 8px;border-radius:8px}
.x:hover{color:var(--crit);background:var(--crit-bg)}

input[type=text],input[type=number],select,textarea{background:var(--sunk);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%;min-width:0;min-height:40px}
textarea{min-height:64px;resize:vertical;line-height:1.7}
input[type=range]{width:100%;accent-color:var(--gold)}
label.f{display:grid;gap:4px;font-size:.8rem;color:var(--ink2);flex:1 1 140px;min-width:0}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.form .full{flex-basis:100%}

.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--ink2);white-space:nowrap;border:1px solid var(--line2)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.ai{background:var(--ai-soft);color:var(--ai);border-color:var(--ai-line)}

.bar{height:7px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:5px}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.crit>i{background:var(--crit)}

.north{background:linear-gradient(160deg,#16283F,#0F1B2D);border:1px solid #243B5A;border-radius:var(--r);padding:16px;display:grid;gap:8px}
.north .fig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.north .fig strong{font-size:clamp(1.7rem,7vw,2.3rem);font-weight:900;color:#F0C674;line-height:1.1}
.north .fig span{color:#C9D4E2}
.north .track{height:10px;background:#24405F;border-radius:6px;overflow:hidden}
.north .track>i{display:block;height:100%;background:#F0C674;border-radius:6px}
.north .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:#C9D4E2}
.north .meta b{color:#fff}

.now{display:grid;gap:0;padding:0;overflow:hidden}
.now>div{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.now>div:last-child{border-bottom:0}
.now .q{font-size:.76rem;color:var(--ink3);font-weight:700;padding-top:2px}
.now .a{font-size:.93rem}
.now .a b{font-weight:900}
button.link{border:0;background:none;color:var(--ai);padding:0;font-weight:700;font-size:.85rem}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;align-content:start}
.kpi .v{font-size:1.15rem;font-weight:900;line-height:1.3}
.kpi .l{font-size:.72rem;color:var(--ink3)}
.kpi .s{font-size:.72rem;color:var(--ink2)}
.kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)} .kpi.crit .v{color:var(--crit)}

.issue{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border-radius:10px;font-size:.9rem;align-items:start}
.issue .tag{font-size:.68rem;font-weight:900;padding:2px 8px;border-radius:999px;margin-top:3px;white-space:nowrap}
.issue.crit{background:var(--crit-bg)} .issue.crit .tag{background:var(--crit);color:#1A0806}
.issue.warn{background:var(--warn-bg)} .issue.warn .tag{background:var(--warn);color:#1A1003}
.issue.info{background:var(--info-bg)} .issue.info .tag{background:var(--info);color:#0A1220}
.issue.good{background:var(--good-bg)} .issue.good .tag{background:var(--good);color:#04160F}
.issue .sug{color:var(--ink2);font-size:.82rem;margin-top:2px}

.cmd{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cmd:last-child{border-bottom:0}
.cmd .k{font-size:.72rem;color:var(--ink3);font-weight:700}
.cmd .k b{display:block;color:var(--ink);font-size:.9rem;font-weight:900}

.daynav{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink2);padding:6px 12px;border-radius:8px;font-weight:700;font-size:.84rem;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.slot{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--surface)}
.slot.empty{border-style:dashed;background:transparent}
.slot .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slot .t{font-weight:700;flex:1 1 180px}
.slot.done .t{color:var(--ink2)}
.catpill{font-size:.7rem;font-weight:900;padding:2px 9px;border-radius:999px;white-space:nowrap}
.cat-income{background:#133426;color:#5FD19E}
.cat-future{background:#172A48;color:#8CB8FF}
.cat-growth{background:#2C2140;color:#C5A6F2}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sugs button{border:1px dashed var(--line2);background:transparent;color:var(--ink2);border-radius:9px;padding:5px 10px;font-size:.78rem;text-align:right}
.scorebars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:74px}
.scorebars div{display:grid;gap:3px;justify-items:center;font-size:.66rem;color:var(--ink3)}
.scorebars i{display:block;width:100%;max-width:26px;border-radius:4px 4px 0 0;background:var(--line2)}
.scorebars i.good{background:var(--good)} .scorebars i.warn{background:var(--warn)} .scorebars i.crit{background:var(--crit)}

.item{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--surface)}
.item .ttl{font-weight:900;font-size:.98rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:var(--surface);color:var(--ink2);padding:5px 12px;border-radius:999px;font-size:.8rem;font-weight:700;min-height:32px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 12px;font-size:.8rem}
.kv div{display:grid}
.kv span{color:var(--ink3);font-size:.7rem}
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px}
.scores label{font-size:.78rem;color:var(--ink2);display:grid;gap:2px}
.scores output{color:var(--gold);font-weight:900}
.ms{display:flex;gap:8px;align-items:center;font-size:.88rem}
.ms input{accent-color:var(--good);width:18px;height:18px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--ink3);font-weight:700;font-size:.74rem}
td input{width:104px;padding:4px 6px;min-height:34px}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:3}
.share{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:.84rem}

.ai-out{white-space:pre-wrap;line-height:1.95;font-size:.93rem}
.ai-meta{font-size:.72rem;color:var(--ink3)}
.qa{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.qa .q{color:var(--ai);font-weight:700;font-size:.88rem}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 12px;text-align:right;display:grid;gap:4px;min-height:84px;align-content:start}
.menu button b{font-size:.95rem}
.menu button span{font-size:.76rem;color:var(--ink3)}

.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem;margin-top:12px}
.banner.demo{background:var(--warn-bg);border:1px solid var(--warn)}
.banner.info{background:var(--info-bg);border:1px solid var(--line2)}

.wizard{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.wizard .in{max-width:640px;margin:0 auto;display:grid;gap:14px}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.steps i{height:5px;border-radius:3px;background:var(--line2)}
.steps i.on{background:var(--gold)}
.wz-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding-block:10px}
.wz-row{display:grid;grid-template-columns:1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}

.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.86rem;z-index:40;max-width:calc(100% - 32px);text-align:center}
.confirm{background:var(--crit-bg);border:1px solid var(--crit);border-radius:10px;padding:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.86rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="#F0C674" stroke-width="2"/><path d="M17 5 L21 17 L17 29 L13 17 Z" fill="#F0C674"/><path d="M17 17 L21 17 L17 29 L13 17 Z" fill="#6E86A6"/></svg>
      <div style="min-width:0"><b>قطب‌نمای درآمد</b><small id="topSub"></small></div>

</div>

<nav class="bottom" aria-label="بخش‌های اصلی">
  <button data-act="go" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>خانه</button>
  <button data-act="go" data-tab="command"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>فرمان</button>
  <button data-act="go" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>امروز</button>
  <button data-act="go" data-tab="coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>مربی</button>
  <button data-act="go" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>بیشتر</button>
</nav>

<div class="wizard" id="wizard" hidden role="dialog" aria-modal="true" aria-label="راه‌اندازی"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";

/* =====================================================================
   ۱. تاریخ شمسی (الگوریتم jalaali) — تاریخ‌ها داخل برنامه «شماره روز» (JDN) هستند
   ===================================================================== */
function div(a,b){return ~~(a/b);}
function mod(a,b){return a-~~(a/b)*b;}
function jalCal(jy){
  const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  const gy=jy+621; let leapJ=-14, jp=breaks[0], jm, jump=0, n, i;
  for(i=1;i<breaks.length;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm;}
  n=jy-jp; leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4) leapJ+=1;
  const leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150; const march=20+leapJ-leapG;
  if(jump-n<6) n=n-jump+div(jump+4,33)*33;
  let leap=mod(mod(n+1,33)-1,4); if(leap===-1) leap=4;
  return {leap,gy,march};
}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1;const gm=mod(div(i,153),12)+1;const gy=div(j,1461)-100100+div(8-gm,6);return {gy,gm,gd};}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy);const f=g2d(gy,3,r.march);let jd,jm,k=jdn-f;
  if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return {jy,jm,jd};}else k-=186;}
  else{jy-=1;k+=179;if(r.leap===1)k+=1;}
  jm=7+div(k,30);jd=mod(k,30)+1;return {jy,jm,jd};}
const MONTHS=["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const WEEKDAYS=["شنبه","یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه"];
const pad=n=>String(n).padStart(2,"0");

function isLeapJ(jy){return jalCal(jy).leap===0;}
function monthLen(jy,jm){return jm<=6?31:jm<=11?30:(isLeapJ(jy)?30:29);}
function toLatin(s){return String(s==null?"":s).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));}
function parseJ(s,end){
  const m=/^\s*(\d{4})[\/\-.](\d{1,2})(?:[\/\-.](\d{1,2}))?\s*$/.exec(toLatin(s));
  if(!m) return null; const y=+m[1],mo=+m[2]; if(mo<1||mo>12||y<1300||y>1500) return null;
  const ml=monthLen(y,mo); let d=m[3]?+m[3]:(end?ml:1); if(d<1||d>ml) return null;
  return j2d(y,mo,d);
}

function lastMonths(k){const j=d2j(TN);const out=[];for(let i=k-1;i>=0;i--){const t=j.jy*12+(j.jm-1)-i;const y=Math.floor(t/12),m=t%12+1;out.push({k:y+"-"+pad(m),label:MONTHS[m-1],y,m});}return out;}

function normalize(d){
  const E=emptyData();
  d=Object.assign(E,d||{});
  d.profile=Object.assign(emptyData().profile,d.profile||{});
  d.vision=Object.assign(emptyData().vision,d.vision||{});
  d.ai=Object.assign({reality:{}},d.ai||{}); if(!d.ai.reality) d.ai.reality={};
  ["goals","projects","streams","incomeLog","reviews","coachLog","txns","habits","growthPlans"].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  if(!d.profile.life||typeof d.profile.life!=="object") d.profile.life={};
  if(!d.health||typeof d.health!=="object") d.health={checkins:{},subst:[],meals:[]};
  if(!d.health.checkins||typeof d.health.checkins!=="object") d.health.checkins={};
  if(!Array.isArray(d.health.subst)) d.health.subst=[];
  if(!Array.isArray(d.health.meals)) d.health.meals=[];
  d.habits=d.habits.map(h=>Object.assign({id:"h_"+uid(),title:"",freq:"daily",why:"",active:true,created:TN,log:{}},h,{log:(h&&h.log&&typeof h.log==="object")?h.log:{}}));
  if(!d.days||typeof d.days!=="object") d.days={};
  Object.keys(d.days).forEach(k=>{const x=d.days[k];if(!x||!Array.isArray(x.actions))delete d.days[k];});
  d.projects=d.projects.map(p=>{const q=newProject(p);q.sc=Object.assign({inc:3,goal:3,imp:3,urg:3,prob:3},p.sc||{});if(!Array.isArray(q.log))q.log=[];return q;});
  d.goals=d.goals.map(g=>{const q=newGoal(g);if(!Array.isArray(q.ms))q.ms=[];if(!Array.isArray(q.log))q.log=[];return q;});
  d.streams=d.streams.map(s=>{const q=newStream(s);q.entries=q.entries||{};q.hours=q.hours||{};return q;});
  return d;
}

/* مهاجرت از نسخه ۱: داده نمونه کنار گذاشته می‌شود؛ عددهای پیش‌فرض نمونه هم پاک می‌شوند */
const V1_SEED_TARGETS={s_tch:30e6,s_nova:20e6,s_ai:50e6};
const V1_SEED_GOALS=["فروشگاه ثابت و تکراری برای تیچای","درآمد جانبی ماهانه غیر از حقوق","نسخه اول دستیار فروش خودکار (تحلیل بازار → پیام → پیگیری)"];
function migrateV1(o){
  const root={v:2,mode:"real",setupDone:false,real:emptyData()};
  if(o.sample){root.notice="نسخه قبلی فقط داده نمونه داشت؛ آن داده‌ها کنار گذاشته شدند و با داده واقعی قاطی نمی‌شوند.";return root;}
  const R=root.real, p=o.profile||{};
  R.profile.name=p.name||R.profile.name;
  R.profile.target=Number(p.target)===1e8?0:(Number(p.target)||0);
  R.profile.targetEnd=R.profile.target?(p.deadline||""):"";
  if(p.about) R.profile.about=p.about;
  R.vision.text=typeof o.vision==="string"?o.vision:"";
  R.streams=o.streams.map(s=>newStream({id:s.id,name:s.name,kind:s.kind||"active",target:V1_SEED_TARGETS[s.id]===Number(s.target)?0:(Number(s.target)||0),entries:Object.assign({},s.entries),created:TN-400}));
  R.goals=(o.goals||[]).map(g=>{const seed=V1_SEED_GOALS.indexOf(g.title)>=0;
    const q=newGoal({level:g.horizon||"quarter",title:g.title,target:seed?0:(Number(g.target)||0),cur:Number(g.cur)||0,unit:g.unit||"",end:seed?"":(g.deadline||""),ms:(g.ms||[]).map(m=>({t:m.t,done:!!m.done}))});
    q.log=[{n:TN,v:q.cur,init:true}]; q.status=goalComplete(q)?"active":"draft"; return q;});
  R.reviews=(o.reviews||[]).map(r=>{const n=parseJ(r.date,false)||TN;return {id:r.id||uid(),week:weekStart(n),n,ts:r.ts||0,best:r.result||"",fail:r.fail||"",lesson:r.lesson||"",stop:"",focus:r.focus||"",did:r.did||"",auto:null,ai:""};});
  if(o.today&&o.today.date===dk(TN)&&Array.isArray(o.today.tasks)){
    R.days[dk(TN)]={closed:false,actions:o.today.tasks.slice(0,3).map((t,i)=>newAction({title:t.t,cat:["income","future","growth"][i],status:t.done?"done":"todo"}))};
  }
  root.notice="داده‌های نسخه قبلی منتقل شد. عددهایی که از نمونه قبلی مانده بودند (هدف ۱۰۰ میلیون و عددهای اهداف پیشنهادی) پاک شدند تا خودت عدد واقعی بگذاری.";
  return root;
}

/* =====================================================================
   ۶. موتور محاسبه — فقط از داده ثبت‌شده؛ هیچ عددی حدس زده نمی‌شود

const byId=(arr,id)=>id?arr.find(x=>x.id===id):undefined;

function goalComplete(g){return !!(String(g.title||"").trim()&&Number(g.target)>0&&parseJ(g.end,true)!=null);}

// امتیاز ارزش ۰ تا ۱۰۰ — فوریت کمترین وزن را دارد (هرگز فقط بر اساس فوریت اولویت نمی‌دهیم)

    const v=valueScore(p),hl=hoursLeft(p);return {p,v,hl,exp:expectedMonthly(p),vph:hl?v/Math.max(1,hl):null};

// آیا مقدار در بازه [a,b] نسبت به قبل افزایش داشته؟ (مقدار اولیه هنگام ساخت، پیشرفت حساب نمی‌شود)
function progressed(log,a,b){
  if(!Array.isArray(log)) return false; let prev=null;
  for(const e of log.slice().sort((x,y)=>x.n-y.n)){
    if(e.n<a||e.init){if(e.n<=b)prev=e.v;continue;}
    if(e.n>b) break;
    if(prev==null?e.v>0:e.v>prev) return true; prev=e.v;

function goalPace(g){
  const s=parseJ(g.start,false),e=parseJ(g.end,true); const p=g.target?clamp((Number(g.cur)||0)/g.target,0,1.5):0;
  if(s==null||e==null||e<s) return {p,t:null,diff:null,daysLeft:e!=null?e-TN:null};

function goalState(g){

  const pc=goalPace(g);
  if(pc.p>=1) return ["good","به عدد هدف رسید"];
  if(pc.daysLeft!=null&&pc.daysLeft<0) return ["crit","مهلت گذشته"];
  if(pc.diff!=null&&pc.diff<-0.15) return ["crit","عقب از برنامه"];
  if(pc.diff!=null&&pc.diff<0) return ["warn","کمی عقب"];

function goalActions(g){let t=0,dn=0,last=null;Object.keys(D.days).sort().forEach(k=>D.days[k].actions.forEach(a=>{if(a.goalId===g.id){t++;if(a.status==="done")dn++;last=a;}}));return {t,dn,last};}
function linked(a){const p=byId(D.projects,a.projectId),g=byId(D.goals,a.goalId);return !!((p&&p.status==="active")||(g&&g.status==="active"));}
function incomeLinked(a){if(a.cat==="income")return true;const p=byId(D.projects,a.projectId);return !!(p&&sc(p,"inc")>=4);}
function actionValue(a){const p=byId(D.projects,a.projectId);let v=p?valueScore(p):(a.goalId?40:20);if(a.cat==="income")v=Math.min(100,v+10);return v;}
const wOf=a=>a.status==="done"?1:a.status==="partial"?0.5:0;
function dayIncome(n){return D.incomeLog.filter(l=>l.n===n).reduce((s,l)=>s+(Number(l.amount)||0),0);}
// امتیاز روز: نتیجه (۳۵) بیشتر از اجرا (۲۵) وزن دارد
function dayScore(n){
  const d=D.days[dk(n)]; if(!d||!d.actions.length) return null; const A=d.actions;
  const doneW=A.reduce((s,a)=>s+wOf(a),0); const doneA=A.filter(a=>wOf(a)>0);
  const exec=Math.min(1,doneW/3)*25;
  const inc=dayIncome(n)>0?20:0;
  const res=doneA.length?doneA.filter(a=>String(a.result||"").trim()).length/doneA.length*15:0;
  const focus=A.filter(linked).length/A.length*20;
  const disc=(d.closed?10:0)+(doneA.length&&doneA.every(a=>Number(a.actualMin)>0)?5:0)+(A.length>=3?5:0);
  return {total:Math.round(exec+inc+res+focus+disc),exec,result:inc+res,focus,disc,doneW,count:A.length};

function effectiveDay(n){const s=dayScore(n);return !!s&&(s.doneW>=2||dayIncome(n)>0);}
function weekStats(ws){
  const r={ws,total:0,doneW:0,minutes:0,income:0,effective:0,closed:0,withActions:0,linked:0,incLinked:0,lowMin:0,scoreSum:0,scoreN:0,actions:[]};
  for(let n=ws;n<=ws+6;n++){
    r.income+=dayIncome(n); if(n>TN) continue;
    const d=D.days[dk(n)]; if(!d||!d.actions.length) continue;
    r.withActions++; if(d.closed) r.closed++;
    d.actions.forEach(a=>{r.total++;r.doneW+=wOf(a);const m=Number(a.actualMin)||0;r.minutes+=m;
      if(linked(a))r.linked++; if(incomeLinked(a))r.incLinked++; if(actionValue(a)<45||!linked(a))r.lowMin+=m; r.actions.push(Object.assign({n},a));});
    const s=dayScore(n); r.scoreSum+=s.total; r.scoreN++; if(effectiveDay(n)) r.effective++;
  }
  r.exec=r.total?r.doneW/r.total:null; r.hours=r.minutes/60;
  r.expense=D.txns.filter(t=>t.dir==="out"&&t.cat!==SELF&&t.n>=ws&&t.n<=ws+6).reduce((a,t)=>a+t.amount,0);
  r.projProg=D.projects.filter(p=>progressed(p.log,ws,ws+6));
  r.goalProg=D.goals.filter(g=>progressed(g.log,ws,ws+6));
  const tgt=Number(D.profile.target)||0, wt=tgt*7/30.4;
  const incPart=tgt?clamp(r.income/wt,0,1):(r.income>0?1:0);
  const ap=activeProjects().length, ag=activeGoals().length;
  r.parts={exec:20*(r.exec||0),income:35*incPart,proj:15*(ap?r.projProg.filter(p=>p.status==="active").length/ap:0),goal:15*(ag?r.goalProg.filter(g=>g.status==="active").length/ag:0),focus:10*(r.total?r.linked/r.total:0),disc:5*(r.withActions?r.closed/r.withActions:0)};
  r.score=(r.total||r.income)?Math.round(Object.values(r.parts).reduce((a,b)=>a+b,0)):null;
  return r;
}
function monthTotal(k){return D.streams.reduce((a,s)=>a+(Number(s.entries[k])||0),0);}
function hasMonth(k){return D.streams.some(s=>s.entries[k]!=null&&s.entries[k]!=="");}
function trendOf(v){if(v.every(x=>!x))return "none";if(v[2]>v[1]&&v[1]>=v[0])return "up";if(v[2]<v[1]&&v[1]<=v[0])return "down";if(v[2]>v[0]*1.1)return "up";if(v[2]<v[0]*0.9)return "down";return "flat";}
const TREND={up:["good","در حال رشد"],down:["crit","در حال افت"],flat:["info","ثابت"],none:["warn","بدون درآمد"]};
function incomeReport(){
  const ms=lastMonths(7), cur=ms[6], prev=ms[5], j=d2j(TN), ml=monthLen(j.jy,j.jm);
  const curT=monthTotal(cur.k), prevT=hasMonth(prev.k)?monthTotal(prev.k):null;
  const prior=ms.slice(0,6).filter(m=>hasMonth(m.k)); const avg=prior.length?prior.reduce((a,m)=>a+monthTotal(m.k),0)/prior.length:null;
  const job=D.streams.filter(s=>s.kind==="job").reduce((a,s)=>a+(Number(s.entries[cur.k])||0),0);

  });
  return {ms,cur,prev,curT,prevT,avg,vsPrev:prevT?(curT-prevT)/prevT:null,vsAvg:avg?(curT-avg)/avg:null,pace,side,job,tgt,gap:tgt?Math.max(0,tgt-curT):null,ach:tgt?curT/tgt:null,streams,dayOfMonth:j.jd,monthLen:ml};
}
// ظرفیت: هر پروژه برای جلو رفتن واقعی حداقل ۶ ساعت در هفته می‌خواهد
function capacity(){const fh=Number(D.profile.freeHours)||0;return fh?clamp(Math.floor(fh/6),1,4):3;}
function focusGuard(){
  const out=[],P=activeProjects(),fh=Number(D.profile.freeHours)||0,cap=capacity(),m3=lastMonths(3);
  if(P.length>cap) out.push({sev:"crit",tag:"ظرفیت",text:`شما ${fa(P.length)} پروژه فعال دارید؛ ${fh?`با ${fa(fh)} ساعت آزاد در هفته`:"(ساعت آزاد هفتگی ثبت نشده)"} ظرفیت واقعی اجرای شما حدود ${fa(cap)} پروژه است.`,sug:"پروژه‌های با کمترین امتیاز ارزش را Paused کن تا بقیه واقعاً جلو بروند.",go:"projects"});

  if(noRes.length) out.push({sev:noRes.length>=2?"crit":"warn",tag:"بی‌نتیجه",text:`${fa(noRes.length)} پروژه فعال در ۳۰ روز اخیر نه درآمد داشته‌اند نه پیشرفت ثبت‌شده: ${noRes.map(p=>"«"+p.name+"»").join("، ")}.`,sug:"برای هرکدام یک خروجی قابل اندازه‌گیری در ۷ روز آینده تعریف کن، یا متوقفش کن.",go:"projects"});
  const hSum=P.reduce((a,p)=>a+(Number(p.weeklyHours)||0),0);
  if(fh&&hSum>fh) out.push({sev:"warn",tag:"زمان",text:`پروژه‌های فعال ${fa(hSum)} ساعت در هفته زمان می‌خواهند؛ تو ${fa(fh)} ساعت آزاد داری.`,sug:"یا زمان پروژه‌ها را واقع‌بینانه کن یا تعدادشان را کم کن.",go:"projects"});
  const G=activeGoals(); if(G.length>6) out.push({sev:"warn",tag:"اهداف",text:`${fa(G.length)} هدف فعال همزمان داری. وقتی همه‌چیز هدف است، هیچ‌چیز اولویت نیست.`,sug:"اهداف فعال را به حداکثر ۵ عدد برسان؛ بقیه را متوقف کن.",go:"goals"});

/* ---------- نمودار ستونی انباشته ---------- */
function colorOf(i){return "var(--s"+(i%4+1)+")";}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function drawChart(host,k){
  const months=lastMonths(k), all=D.streams.filter(s=>months.some(m=>Number(s.entries[m.k])>0));
  const ss=all.slice(0,3), rest=all.slice(3);
  const series=ss.map((s,i)=>({name:s.name,color:colorOf(i),val:m=>Number(s.entries[m.k])||0}));
  if(rest.length) series.push({name:"سایر",color:colorOf(3),val:m=>rest.reduce((a,s)=>a+(Number(s.entries[m.k])||0),0)});
  if(!series.length){host.innerHTML='<p class="muted">هنوز درآمدی ثبت نشده. از بخش درآمد، عددهای واقعی را وارد کن.</p>';return;}
  const W=640,H=240,L=62,R=10,T=12,B=30,pw=W-L-R,ph=H-T-B;
  const totals=months.map(m=>series.reduce((a,s)=>a+s.val(m),0)); const target=Number(D.profile.target)||0;
  let max=Math.max(1,...totals,target); const step=niceStep(max/4); max=Math.ceil(max/step)*step;
  const y=v=>T+ph-(v/max)*ph, slot=pw/months.length, bw=Math.min(46,slot*0.55);
  let g=`<div class="legend">${series.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="درآمد ماهانه به تفکیک منبع" style="direction:ltr">`;
  for(let v=0;v<=max+1;v+=step) g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#1C2A40" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#71809A" font-family="Vazirmatn,Tahoma,sans-serif">${money(v)}</text>`;
  months.forEach((m,i)=>{
    const cx=L+slot*(i+.5); let acc=0; const segs=series.map(s=>({v:s.val(m),c:s.color})).filter(x=>x.v>0);
    segs.forEach((sg,j)=>{const y0=y(acc),y1=y(acc+sg.v);acc+=sg.v;const top=j===segs.length-1;const h=Math.max(1,y0-y1-(top?0:2));const r=Math.min(4,h);
      g+=top?`<path d="M${cx-bw/2},${y0} V${y0-h+r} Q${cx-bw/2},${y0-h} ${cx-bw/2+r},${y0-h} H${cx+bw/2-r} Q${cx+bw/2},${y0-h} ${cx+bw/2},${y0-h+r} V${y0} Z" fill="${sg.c}"/>`:`<rect x="${cx-bw/2}" y="${y0-h}" width="${bw}" height="${h}" fill="${sg.c}"/>`;});
    g+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="12" fill="#A7B3C5" font-family="Vazirmatn,Tahoma,sans-serif">${m.label}</text><rect x="${cx-slot/2}" y="${T}" width="${slot}" height="${ph}" fill="transparent" data-mi="${i}"/>`;
  });
  if(target) g+=`<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="#E3B35C" stroke-width="2" stroke-dasharray="6 5"/>`;
  g+=`</svg><div class="tip" hidden></div></div>`;
  host.innerHTML=g;
  const tip=host.querySelector(".tip"), box=host.querySelector(".chart");
  host.querySelectorAll("[data-mi]").forEach(r=>{
    r.addEventListener("pointerenter",()=>{const i=+r.dataset.mi,m=months[i];
      tip.innerHTML=`<b>${m.label}</b> · ${money(totals[i])}<br>`+series.map(s=>`${esc(s.name)}: ${money(s.val(m))}`).join("<br>");
      tip.hidden=false; const b=box.getBoundingClientRect(),rb=r.getBoundingClientRect(),tw=tip.offsetWidth;
      tip.style.left=clamp(rb.left-b.left+rb.width/2-tw/2,0,Math.max(0,b.width-tw))+"px"; tip.style.top="4px";});
    r.addEventListener("pointerleave",()=>{tip.hidden=true;});
  });
}

/* ---------- واقعیت بدون تعارف ---------- */
function realityFacts(){
  const cw=weekStart(TN), w=weekStats(cw), lw=weekStats(cw-7), rep=incomeReport(), AP=activeProjects(), AG=activeGoals(), cap=capacity(), F=[];
  const V=(ok,t)=>ok==null?["info","داده کافی نیست"]:ok?["good",t[0]]:["crit",t[1]];
  const noInc=!w.income&&!lw.income&&rep.prevT==null;
  F.push({q:"آیا درآمد رشد کرده؟",v:V(noInc?null:(w.income>lw.income||(rep.prevT!=null&&rep.pace>rep.prevT)),["بله","خیر"]),a:`این هفته ${money(w.income)} در برابر ${money(lw.income)} هفته قبل. برآورد این ماه ${money(rep.pace)} در برابر ${rep.prevT!=null?money(rep.prevT):"— (ثبت نشده)"} ماه قبل.`});
  const behind=AG.filter(g=>goalState(g)[0]==="crit").length;
  F.push({q:"آیا هدف‌ها جلو رفته‌اند؟",v:V(AG.length?w.goalProg.some(g=>g.status==="active"):null,["بله","خیر"]),a:`${fa(w.goalProg.filter(g=>g.status==="active").length)} هدف از ${fa(AG.length)} هدف فعال این هفته جلو رفته.${behind?` ${fa(behind)} هدف عقب از برنامه است.`:""}`});
  const pout=AP.filter(p=>w.projProg.indexOf(p)>=0||projIncome(p,[lastMonths(1)[0]])>0);
  F.push({q:"آیا پروژه‌ها خروجی واقعی داشته‌اند؟",v:V(AP.length?pout.length>=Math.ceil(AP.length/2):null,["بیشترشان","اکثراً نه"]),a:`${fa(pout.length)} از ${fa(AP.length)} پروژه فعال این هفته پیشرفت ثبت‌شده یا درآمد این ماه داشته‌اند.`});
  F.push({q:"چه مقدار زمان صرف کارهای کم‌ارزش شده؟",v:V(w.minutes?w.lowMin/w.minutes<=0.25:null,["کم","زیاد"]),a:w.minutes?`${hrs(w.lowMin)} از ${hrs(w.minutes)} (${pct(w.lowMin/w.minutes)}) روی اقدام‌های با امتیاز ارزش زیر ۴۵ یا وصل‌نشده به پروژه/هدف فعال.`:"زمان واقعی اقدام‌ها این هفته ثبت نشده."});
  const byS={}; D.incomeLog.filter(l=>l.n>=TN-30&&l.n<=TN).forEach(l=>{const s=byId(D.streams,l.streamId);if(s)byS[s.name]=(byS[s.name]||0)+l.amount;});
  const best=Object.entries(byS).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
  let bestAct=null; forDays(TN-14,TN,(n,d)=>d.actions.forEach(a=>{if(a.status==="done"&&a.cat==="income"&&a.result&&(!bestAct||actionValue(a)>actionValue(bestAct)))bestAct=a;}));
  F.push({q:"کدام فعالیت بیشترین نتیجه را داده؟",v:best||bestAct?["good","مشخص"]:["info","داده کافی نیست"],a:((best?`بیشترین درآمد ثبت‌شده ۳۰ روز اخیر: «${best[0]}» با ${money(best[1])}. `:"")+(bestAct?`اقدام درآمدساز با نتیجه ثبت‌شده: «${bestAct.title}» ← ${bestAct.result}`:""))||"در ۳۰ روز اخیر درآمد یا نتیجه درآمدی ثبت نشده."});
  const waste=D.projects.filter(p=>projMinutes(p,TN-14,TN)>0&&!progressed(p.log,TN-14,TN)&&projIncome(p,lastMonths(1))===0);
  F.push({q:"کدام پروژه فقط زمان مصرف کرده؟",v:waste.length?["crit",fa(waste.length)+" پروژه"]:["good","هیچ‌کدام"],a:waste.length?waste.map(p=>`«${p.name}»: ${hrs(projMinutes(p,TN-14,TN))} در ۱۴ روز، بدون پیشرفت ثبت‌شده و بدون درآمد`).join("؛ "):"هر پروژه‌ای که در ۱۴ روز اخیر زمان گرفته، پیشرفت یا درآمد ثبت‌شده داشته."});
  F.push({q:"آیا تعداد پروژه‌ها بیش از ظرفیت اجرایی است؟",v:AP.length>cap?["crit","بله"]:["good","خیر"],a:`${fa(AP.length)} پروژه فعال؛ ظرفیت محاسبه‌شده ${fa(cap)} (${D.profile.freeHours?fa(D.profile.freeHours)+" ساعت آزاد در هفته ÷ ۶":"ساعت آزاد ثبت نشده؛ پیش‌فرض ۳"}).`});
  const top=new Set(rankProjects().filter(r=>r.p.status==="active").slice(0,2).map(r=>r.p.id)); if(D.profile.mainProjectId) top.add(D.profile.mainProjectId);
  const mainLinked=w.actions.filter(a=>top.has(a.projectId)||(a.goalId&&a.goalId===D.profile.mainGoalId)).length;
  F.push({q:"آیا اقدامات روزانه به اهداف اصلی وصل بوده‌اند؟",v:V(w.total?mainLinked/w.total>=0.5:null,["بیشترشان","کمتر از نصف"]),a:w.total?`${fa(mainLinked)} از ${fa(w.total)} اقدام این هفته (${pct(mainLinked/w.total)}) به پروژه اصلی یا دو پروژه باارزش‌تر وصل بوده. ${fa(w.total-w.linked)} اقدام به هیچ پروژه/هدف فعالی وصل نبوده.`:"این هفته اقدامی ثبت نشده."});
  return F;
}

function getDay(n,create){const k=dk(n);if(!D.days[k]&&create)D.days[k]={actions:[],closed:false};return D.days[k];}
function findAction(id){for(const k in D.days){const a=D.days[k].actions.find(x=>x.id===id);if(a)return {a,d:D.days[k]};}return null;}
function addIncome(streamId,amount,n,txnId){
  const s=byId(D.streams,streamId); if(!s||!(amount>0)) return false; const k=mkOf(n);
  s.entries[k]=(Number(s.entries[k])||0)+amount; const e={id:uid(),n,streamId,amount}; if(txnId)e.txnId=txnId; D.incomeLog.push(e); return true;
}
// همان منطق سرور: واریزی که به منبع درآمد وصل شود، به درآمد همان منبع اضافه می‌شود
function unlinkTxnIncome(t){
  if(!t.streamId) return; const s=byId(D.streams,t.streamId), k=mkOf(t.n);
  if(s&&s.entries[k]!=null) s.entries[k]=Math.max(0,(Number(s.entries[k])||0)-t.amount);
  D.incomeLog=D.incomeLog.filter(l=>l.txnId!==t.id); t.streamId="";
}
function classifyTxn(t,v){
  unlinkTxnIncome(t);
  if(v.startsWith("s:")){if(addIncome(v.slice(2),t.amount,t.n,t.id)){t.streamId=v.slice(2);t.cat="درآمد";}}
  else t.cat=v.slice(2);
}

async function coachAsk(label,prompt,fresh){
  if(AI_BUSY||!SAMPLE) return; AI_BUSY=true; setAiButtons(true); TOMORROW_PLAN=null; const pb=$("planBox"); if(pb) pb.innerHTML="";

  if(WSTEP===3) body=`<p class="muted">پروژه‌های اولیه ساخته شده‌اند. نام، وضعیت و اقدام بعدی را مشخص کن. امتیازدهی دقیق بعداً در بخش پروژه‌ها.</p>
    ${R.projects.map((p,i)=>`<div class="wz-row"><div class="form"><label class="f full">نام<input type="text" data-chg="wz-p" data-i="${i}" data-f="name" value="${esc(p.name)}"></label>
      <label class="f">وضعیت<select data-chg="wz-p" data-i="${i}" data-f="status">${Object.keys(PSTAT).map(k=>`<option value="${k}"${p.status===k?" selected":""}>${PSTAT[k]}</option>`).join("")}</select></label>
      <label class="f">ساعت در هفته<input type="number" min="0" data-chg="wz-p" data-i="${i}" data-f="weeklyHours" value="${p.weeklyHours||""}"></label>
      <label class="f full">اقدام بعدی<input type="text" data-chg="wz-p" data-i="${i}" data-f="nextAction" value="${esc(p.nextAction)}"></label></div></div>`).join("")}
    <form class="form" data-form="wz-padd"><label class="f">پروژه جدید<input type="text" id="wz-pname"></label><button class="btn">افزودن</button></form>`;
  if(WSTEP===4){const cap=capacity(),n=activeProjects().length;body=`<label class="f">چند ساعت در هفته، خارج از کار اصلی، واقعاً آزاد داری؟<input type="number" id="wz-free" min="0" value="${P.freeHours||""}"></label>
    <p class="muted">ظرفیت پروژه فعال = ساعت آزاد ÷ ۶ (هر پروژه برای جلو رفتن واقعی حداقل ۶ ساعت در هفته می‌خواهد). با تغییر عدد و رفتن به مرحله بعد، دوباره حساب می‌شود.</p>
    <div class="issue ${n>cap?"crit":"good"}"><span class="tag">ظرفیت</span><div>با ${P.freeHours?fa(P.freeHours)+" ساعت":"ساعت نامشخص (پیش‌فرض)"}، ظرفیت حدود ${fa(cap)} پروژه فعال است. الان ${fa(n)} پروژه Active داری.</div></div>`;}
  if(WSTEP===5) body=`<label class="f">پروژه اصلی این فصل<select id="wz-mp"><option value="">—</option>${R.projects.filter(p=>p.status==="active").map(p=>`<option value="${p.id}"${p.id===P.mainProjectId?" selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
    <label class="f">هدف اصلی<select id="wz-mg"><option value="">—</option>${R.goals.map(g=>`<option value="${g.id}"${g.id===P.mainGoalId?" selected":""}>${esc(g.title)}${goalComplete(g)?"":" (ناقص)"}</option>`).join("")}</select></label>
    <label class="f">اولویت اصلی در یک جمله<input type="text" id="wz-pri" value="${esc(P.mainPriority)}" placeholder="مثلاً: فروش اولین نسخه VQ قبل از پایان فصل"></label>`;
  if(WSTEP===6){const fg=focusGuard();body=`<div class="kv num"><div><span>منابع درآمد</span>${fa(R.streams.length)}</div><div><span>درآمد ثبت‌شده این ماه</span>${hasMonth(CURM())?money(monthTotal(CURM())):"ثبت نشده"}</div><div><span>هدف ماهانه</span>${P.target?money(P.target):"ثبت نشده"}</div><div><span>اهداف کامل / ناقص</span>${fa(R.goals.filter(goalComplete).length)} / ${fa(R.goals.filter(g=>!goalComplete(g)).length)}</div><div><span>پروژه فعال / ظرفیت</span>${fa(activeProjects().length)} / ${fa(capacity())}</div></div>
    ${fg.length?`<span class="eyebrow">Focus Guard</span>${fg.map(i=>issueHtml(i,false)).join("")}`:'<div class="issue good"><span class="tag">تمرکز</span><div>تعداد پروژه‌ها در محدوده ظرفیت است.</div></div>'}
    <p>بعد از شروع: هر روز ۳ اقدام انتخاب کن، آخر روز نتیجه را ثبت کن، و هر هفته بازبینی کن.</p>`;}
  $("wizard").innerHTML=`<div class="in">
    <div class="row spread"><b>راه‌اندازی · مرحله ${fa(WSTEP+1)} از ۷</b><button class="btn ghost sm" data-act="wz-demo">فعلاً Sample Data را ببینم</button></div>
    <div class="steps">${WTITLES.map((t,i)=>`<i class="${i<=WSTEP?"on":""}" title="${t}"></i>`).join("")}</div>
    <h1 style="font-size:1.3rem;font-weight:900">${WTITLES[WSTEP]}</h1>
    <div class="stack">${body}</div>
    <div class="wz-foot"><button class="btn" data-act="wz-back" ${WSTEP===0?"disabled":""}>قبلی</button><button class="btn primary" data-act="wz-next">${WSTEP===6?"شروع برنامه":"بعدی"}</button></div>
  </div>`;
}
function wzSave(){
  const R=ROOT.real,P=R.profile;
  if(WSTEP===0){P.name=val("wz-name");P.about=val("wz-about");}
  if(WSTEP===1){const e=val("wz-tend");if(e&&parseJ(e,true)==null){toast("تاریخ معتبر نیست (مثل 1406/12).");return false;}P.target=num(val("wz-target"));P.targetEnd=e;}
  if(WSTEP===2){R.vision.text=val("wz-vision");}
  if(WSTEP===4){P.freeHours=num(val("wz-free"));}
  if(WSTEP===5){P.mainProjectId=val("wz-mp");P.mainGoalId=val("wz-mg");P.mainPriority=val("wz-pri");}
  persist(); return true;
}
const WZ={
  "wz-next"(){if(!wzSave())return;if(WSTEP<6){WSTEP++;renderWizard();$("wizard").scrollTo(0,0);}else{ROOT.setupDone=true;persist();closeWizard();VIEWDAY=TN;showTab("today");toast("شروع شد. اولین قدم: ۳ اقدام امروز.");}},
  "wz-back"(){wzSave();if(WSTEP>0){WSTEP--;renderWizard();}},
  "wz-demo"(){wzSave();ROOT.mode="demo";useData();persist();closeWizard();showTab("home");},
  "wz-sdel"(el){wzSave();ROOT.real.streams.splice(+el.dataset.i,1);persist();renderWizard();},
  "wz-ssug"(el){wzSave();const n=el.dataset.n,vq=ROOT.real.projects.find(p=>p.name.indexOf("VQ")===0);ROOT.real.streams.push(newStream({name:n,kind:n==="حقوق"?"job":"active",projectId:n.indexOf("VQ")===0&&vq?vq.id:""}));persist();renderWizard();},
  "wz-gdel"(el){wzSave();ROOT.real.goals.splice(+el.dataset.i,1);persist();renderWizard();},
  "wz-gtpl"(el){const t=GOAL_TEMPLATES[+el.dataset.i];$("wz-gt").value=t[0];$("wz-gw").value=t[1];$("wz-gl").value=t[2];$("wz-gu").value=t[3];$("wz-gn").focus();}
};
const WZF={
  "wz-sadd"(){const n=val("wz-sname");if(!n)return;wzSave();ROOT.real.streams.push(newStream({name:n}));persist();renderWizard();},
  "wz-gadd"(){const e=val("wz-ge"),t=val("wz-gt");if(!t)return;if(e&&parseJ(e,true)==null){toast("تاریخ پایان معتبر نیست (مثل 1405/12/29).");return;}
    const vq=ROOT.real.projects.find(p=>p.name.indexOf("VQ")===0);
    const g=newGoal({title:t,why:val("wz-gw"),level:val("wz-gl"),target:num(val("wz-gn")),unit:val("wz-gu"),end:e,projectId:t.indexOf("VQ")>=0&&vq?vq.id:""});g.status=goalComplete(g)?"active":"draft";
    wzSave();ROOT.real.goals.push(g);persist();renderWizard();toast(g.status==="active"?"هدف ثبت شد.":"هدف ناقص به‌عنوان پیش‌نویس ذخیره شد.");},
  "wz-padd"(){const n=val("wz-pname");if(!n)return;wzSave();ROOT.real.projects.push(newProject({name:n}));persist();renderWizard();}
};
const WZC={
  "wz-s"(el){const s=ROOT.real.streams[+el.dataset.i],f=el.dataset.f,cm=lastMonths(2);if(!s)return;
    if(f==="kind")s.kind=el.value;else if(f==="target")s.target=num(el.value);
    else{const k=f==="cur"?cm[1].k:cm[0].k;if(el.value==="")delete s.entries[k];else s.entries[k]=num(el.value);}
    persist();},
  "wz-p"(el){const p=ROOT.real.projects[+el.dataset.i],f=el.dataset.f;if(!p)return;p[f]=f==="weeklyHours"?num(el.value):el.value;persist();}
};

/* =====================================================================
   ۱۱. شروع
   ===================================================================== */
ROOT=rootFrom(lsGet(LS2));
if(!ROOT){ROOT=rootFrom(lsGet(LS1));if(ROOT)lsSet(LS2,payload());}   // نتیجه مهاجرت از نسخه ۱ فوراً ذخیره شود
if(!ROOT) ROOT={v:2,mode:"real",setupDone:false,real:emptyData()};
useData();
let startTab="home";try{startTab=localStorage.getItem(LS2+".tab")||"home";}catch(e){}
try{const h=location.hash.slice(1);if(/^[a-z]+$/.test(h)&&$pane(h))startTab=h;}catch(e){}
showTab(startTab);
if(API){apiLoad(true);setInterval(()=>apiLoad(false),15000);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")apiLoad(false);});}
else if(!ROOT.setupDone&&ROOT.mode==="real") openWizard();
// اگر اپ باز بماند و روز عوض شود، همه‌چیز دوباره حساب می‌شود
setInterval(()=>{const n=nowN();if(n!==TN){TN=n;VIEWDAY=n;render();}},60000);

if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("db").then(async db=>{
    if(!db) return;
    try{
      dbRef=db.doc("plan/main");
      const snap=await dbRef.get();
      const raw=snap.exists?JSON.parse((snap.data()||{}).state||"null"):null;
      const r=rootFrom(raw);
      if(r){
        const wasOpen=!$("wizard").hidden;
        ROOT=r; useData(); lsSet(LS2,payload());
        if(raw.v!==2) persist();   // نتیجه مهاجرت از نسخه ۱ ذخیره شود
        if(!ROOT.setupDone&&ROOT.mode==="real"){if(wasOpen){prepWizardData();renderWizard();}else openWizard();}
        else if(wasOpen) closeWizard();
        render();
      } else persist();
      setSync(true);
    }catch(e){dbRef=null;setSync(false);}
  }).catch(()=>{});
  window.claude.use("sample").then(s=>{SAMPLE=s||null;render();}).catch(()=>{});
}
})();
</script>
</body>
</html>
